<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Clip path coverage for the vendored nanosvg. Authored 40x60 so the test can
     read exact pixels after the default rasterization at scale 1.

     Row 1 (y  0..20): plain userSpaceOnUse clip.
     Row 2 (y 20..40): a clipPathUnits="objectBoundingBox" clip intersected with
                       an outer <g clip-path>.
     Row 3 (y 40..60): the shape cairo emits for a clipped fill - a rectangle
                       covering the paint, with the real outline in the clip
                       path - and a colour written as a fractional percentage,
                       which is how cairo writes every colour. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="60" viewBox="0 0 40 60" version="1.1">
  <defs>
    <clipPath id="leftHalf"><rect x="0" y="0" width="20" height="20"/></clipPath>
    <clipPath id="band"><rect x="0" y="20" width="40" height="10"/></clipPath>
    <clipPath id="bbox" clipPathUnits="objectBoundingBox"><rect x="0" y="0" width="0.5" height="1"/></clipPath>
    <clipPath id="blob"><rect x="10" y="45" width="20" height="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="40" height="20" fill="rgb(100%, 0%, 0%)" clip-path="url(#leftHalf)"/>

  <g clip-path="url(#band)">
    <rect x="0" y="20" width="40" height="20" fill="rgb(0%, 100%, 0%)" clip-path="url(#bbox)"/>
  </g>

  <g clip-path="url(#blob)">
    <path fill-rule="nonzero" fill="rgb(20.000000%, 40.000000%, 60.000000%)"
          d="M 0 40 L 40 40 L 40 60 L 0 60 Z M 0 40 "/>
  </g>
</svg>
