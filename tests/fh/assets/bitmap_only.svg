<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- A bitmap in an SVG wrapper: no vector geometry at all, just an <image>.
     This is what Inkscape and pdftocairo produce from a PDF page that is a
     photograph, and it used to load "successfully" and draw as nothing. The
     loader must refuse it and say why. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="16" height="16" viewBox="0 0 16 16" version="1.1">
  <image x="0" y="0" width="16" height="16" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4z8DwHwAFAAH/iZk9HQAAAABJRU5ErkJggg=="/>
</svg>
